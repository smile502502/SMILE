    :root{
      --topbar:#455A64;
      --bg:#F7F5F1;
      --ink:#1A1A1A;
      --muted:#666;
      --red:#B71C1C;
      --amber:#FFC107;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
    body{padding-bottom:calc(env(safe-area-inset-bottom) + 90px);}

    /* 顶部栏 */
    .topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;gap:10px;
      background:var(--topbar);color:#fff;
      padding:12px 14px;
      padding-top:calc(env(safe-area-inset-top) + 12px);
    }
    .topbar .title{font-size:18px;font-weight:700;white-space:nowrap;}
    .topbar .window{flex:1;text-align:right;font-size:12px;color:#CFD8DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .refresh-btn{
      margin-left:auto;background:var(--amber);color:#1A1A1A;
      border-radius:14px;padding:5px 14px;font-size:13px;font-weight:600;white-space:nowrap;
    }
    .refresh-btn:active{opacity:.8;}
    .refresh-btn.disabled{background:#CFD8DC;color:#90A4AE;}

    /* 内容 */
    .wrap{max-width:720px;margin:0 auto;padding:14px 10px 0;}
    .section{margin-bottom:22px;}
    .section-title{font-size:16px;font-weight:700;margin-bottom:10px;}
    .card{
      background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
    }
    .card-new{border:2px solid var(--red);}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
    .card-name{font-size:16px;font-weight:600;}
    .card-channel{font-size:13px;color:#B71C1C;margin:2px 0 4px;}
    .badge-new{
      background:var(--red);color:#fff;font-size:11px;font-weight:700;
      border-radius:9px;padding:2px 8px;white-space:nowrap;
    }
    .card-body{font-size:13px;line-height:1.6;color:#333;white-space:pre-line;}
    .card-hint{margin-top:8px;font-size:12px;color:var(--muted);text-align:right;}

    /* 页脚 */
    .footer{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      background:var(--bg);
      padding:14px 10px calc(env(safe-area-inset-bottom) + 14px);
      text-align:center;
    }
    .footer .slogan{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:1px;}
    .footer .ver{font-size:11px;color:#999;margin-top:4px;}

    /* 状态/空态 */
    .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px;}

    /* 详情页 */
    .detail{padding:20px 16px;}
    .d-title{font-size:22px;font-weight:700;color:var(--topbar);margin-bottom:10px;}
    .d-channel{display:inline-block;background:var(--topbar);color:#fff;border-radius:13px;padding:4px 12px;font-size:13px;margin-bottom:14px;}
    .d-info{font-size:15px;line-height:1.9;color:#333;white-space:pre-line;}
    .back{display:inline-block;margin-top:24px;color:var(--topbar);font-size:14px;text-decoration:none;}
  </style>
</head>
<body>

        ],
        "itvMovies": [
          { "name": "飞驰人生3", "channel": "江苏IPTV 限免", "info": "票房 44.31亿\n9/16 起限免", "newToday": false },
          { "name": "变形金刚：起源", "channel": "江苏IPTV 限免", "info": "票房 1.52亿\n9/16 起限免", "newToday": false },
          { "name": "震耳欲聋", "channel": "海南电信IPTV 限免", "info": "2025-10-04内地公映，票房 2.58亿\n9/16 起限免", "newToday": false },
          { "name": "雄狮少年", "channel": "海南电信IPTV 限免", "info": "2021-12-17内地公映，票房 2.5亿\n9/16 起限免", "newToday": false }

          { "name": "主角", "channel": "CCTV-8 电视剧", "info": "豆瓣8.2；茅盾文学奖（陈彦）\n9/14 首播第1集，9/19 播至第30集", "newToday": true },
          { "name": "北上", "channel": "CCTV-11 戏曲/黑龙江卫视", "info": "茅盾文学奖（徐则臣）\n9/11 首播，9/11-9/19 连播", "newToday": false },
          { "name": "父母爱情", "channel": "湖北卫视/河北卫视", "info": "飞天奖2015；豆瓣9.3\n9/13-9/14 湖北卫视多集连播，9/18 河北卫视", "newToday": false },
          { "name": "天行健", "channel": "厦门卫视", "info": "豆瓣8.8\n9/13-9/17 下午档每天2-3集，共35集", "newToday": false },
          { "name": "外交风云", "channel": "山东卫视/深圳卫视", "info": "金鹰奖2020最佳电视剧\n9/17 深圳卫视、9/18 山东卫视 各播1场", "newToday": false }
        ]
      };

      // ---- 时钟（北京时间，固定 UTC+8）----
      function bjNow() { return new Date(Date.now() + 8 * 3600 * 1000); }
      function bjHour() { return bjNow().getUTCHours(); }
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function bjDateStr() {
        var d = bjNow();
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
      }
      function yestDateStr() {
        var d = new Date(bjNow().getTime() - 24 * 3600 * 1000);
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
      }
      // 过期判定：10 点前数据日期>=昨天即最新；10 点后需>=今天
      function isFresh(version) {
        var today = bjDateStr(), yest = yestDateStr(), h = bjHour();
        if (h < 10) return version >= yest;
        return version >= today;
      }

      // ---- 本地缓存 ----
      function cacheSave(data) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ data: data, ts: Date.now() }));
        } catch (e) {}
      }
      function cacheLoad() {
        try {
          var raw = localStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          var obj = JSON.parse(raw);
          return obj && obj.data ? obj.data : null;
        } catch (e) { return null; }
      }

      // ---- DOM ----
      var wrap = document.getElementById('wrap');
      var winEl = document.getElementById('window');
      var verEl = document.getElementById('ver');
      var refreshBtn = document.getElementById('refreshBtn');
      var busy = false;

      function fmtWindow(text) {
        if (!text) return '';
        var m = text.match(/(\d{4})-(\d{2})-(\d{2})\D+(\d{2})-(\d{2})/);
        if (m) return m[1] + '.' + m[2] + '.' + m[3] + '-' + m[4] + '.' + m[5];
        return text;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function cardHTML(item, isNewSection) {
        var badge = item.newToday ? '<span class="badge-new">今日新增</span>' : '';
        var cls = isNewSection ? 'card card-new' : 'card';
        var channel = item.channel ? '<div class="card-channel">' + escapeHtml(item.channel) + '</div>' : '';
        return '<div class="' + cls + '" onclick="Qingquan.openDetail(\'' +
          encodeURIComponent(item.name) + '\',\'' + encodeURIComponent(item.channel || '') + '\',\'' +
          encodeURIComponent(item.info || '') + '\')">' +
          '<div class="card-head"><span class="card-name">' + escapeHtml(item.name) + '</span>' + badge + '</div>' +
          channel +
          '<div class="card-body">' + escapeHtml(item.info) + '</div>' +
          '<div class="card-hint">点击查看详情</div>' +
          '</div>';
      }

      function render(data) {
        if (!data) return;
        var html = '';
        // 今日新增
        if (data.todayNew && data.todayNew.length) {
          html += '<div class="section"><div class="section-title">🔥 今日新增（' + data.todayNew.length + '部）</div>';
          data.todayNew.forEach(function (it) { html += cardHTML(it, true); });
          html += '</div>';
        }
        // 电影大片
        if (data.cctv6Movies && data.cctv6Movies.length) {
          html += '<div class="section"><div class="section-title">🎬 电影大片（' + data.cctv6Movies.length + '部）</div>';
          data.cctv6Movies.forEach(function (it) { html += cardHTML(it, false); });
          html += '</div>';
        }
        // 电信ITV限免
        if (data.itvMovies && data.itvMovies.length) {
          html += '<div class="section"><div class="section-title">📺 电信ITV限免（' + data.itvMovies.length + '部）</div>';
          data.itvMovies.forEach(function (it) { html += cardHTML(it, false); });
          html += '</div>';
        }
        // 高分剧集
        if (data.dramas && data.dramas.length) {
          html += '<div class="section"><div class="section-title">🌟 高分剧集（' + data.dramas.length + '部）</div>';
          data.dramas.forEach(function (it) { html += cardHTML(it, false); });
          html += '</div>';
        }
        wrap.innerHTML = html || '<div class="empty">暂无数据</div>';
        winEl.textContent = fmtWindow(data.window);
        verEl.textContent = '清泉看大片 v1.0';
      }

      // ---- 数据加载 ----
      function applyData(data) {
        render(data);
        cacheSave(data);
      }

      function fetchLatest(manual) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', DATA_URL, true);
        xhr.timeout = 10000;
        xhr.onload = function () {
          busy = false; refreshBtn.classList.remove('disabled');
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.version) {
                applyData(data);
                if (manual) flash('已更新：数据版本 ' + data.version);
                return;
              }
            } catch (e) {}
          }
          if (manual) flash('数据格式异常');
        };
        xhr.onerror = function () {
          busy = false; refreshBtn.classList.remove('disabled');
          if (manual) flash('网络异常，请稍后再试');
        };
        xhr.ontimeout = function () {
          busy = false; refreshBtn.classList.remove('disabled');
          if (manual) flash('网络超时，请稍后再试');
        };
        xhr.send();
      }

      function flash(msg) {
        winEl.textContent = msg;
        setTimeout(function () {
          var d = cacheLoad();
          if (d) winEl.textContent = fmtWindow(d.window);
        }, 2500);
      }

      function refresh() {
        if (busy) return;
        // 北京时间 0:00-9:59 禁止刷新
        if (bjHour() < 10) {
          flash('数据更新中，请十点后刷新');
          return;
        }
        busy = true; refreshBtn.classList.add('disabled');
        render(cacheLoad() || BUILTIN); // 先秒开
        fetchLatest(true);              // 异步拉最新，成功自动重渲染
      }

      // 启动流程
      function init() {
        var cached = cacheLoad();
        if (cached) {
          render(cached);
          if (!isFresh(cached.version) && bjHour() >= 10) fetchLatest(false);
        } else {
          render(BUILTIN);
          if (bjHour() >= 10) fetchLatest(false);
        }
      }

      // 详情页
      window.Qingquan = {
        openDetail: function (name, channel, info) {
          var dec = function (s) { try { return decodeURIComponent(s); } catch (e) { return s; } };
          wrap.innerHTML =
            '<div class="detail">' +
            '<div class="d-title">' + escapeHtml(dec(name)) + '</div>' +
            (channel ? '<div class="d-channel">' + escapeHtml(dec(channel)) + '</div>' : '') +
            '<div class="d-info">' + escapeHtml(dec(info)) + '</div>' +
            '<a class="back" href="javascript:void(0)" onclick="Qingquan.back()">← 返回列表</a>' +
            '</div>';
        },
        back: function () {
          var cached = cacheLoad();
          render(cached || BUILTIN);
        }
      };

      // 刷新按钮
      refreshBtn.addEventListener('click', refresh);

      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      }

      init();
    })();
  </script>
