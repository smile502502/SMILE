<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清泉看大片</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 10px; background: #1a0a0a; color: #f0e0c0; }
h1 { color: #F4D03F; text-align: center; font-size: 18px; }
h2 { color: #F4D03F; font-size: 15px; border-bottom: 1px solid #3B1010; padding-bottom: 3px; }
.movie { display: inline-block; width: 45%; margin: 5px; padding: 10px; background: #2a1010; border-radius: 6px; vertical-align: top; }
.poster { width: 120px; height: 180px; background: #3B1010; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; border-radius: 4px; }
.poster-text { writing-mode: vertical-rl; text-orientation: upright; color: #F4D03F; font-size: 18px; font-weight: bold; }
.new-tag { color: #FF5252; font-size: 11px; text-align: center; }
.info { font-size: 12px; line-height: 1.4; }
.channel { color: #F4D03F; }
</style>
</head>
<body>
<h1>清泉看大片</h1>
<p style="text-align:center;color:#d0c0a0;font-size:12px;">免费看大片_20261005_央视CCTV卫视IPTV今天今晚</p>
<div id="content">加载中...</div>
<script>
fetch('todaymovie_data.json').then(r=>r.json()).then(data=>{
  var html='<h2>今日新增</h2><div style="text-align:center;">';
  data.todayNew.forEach(function(item){
    var lines=item.info.split('\n');
    html+='<div class="movie"><div class="poster"><div class="poster-text">'+item.name+'</div></div><div class="new-tag">今日新增</div><div class="info"><span class="channel">'+item.channel+'</span><br>'+lines[0]+'<br>'+lines[1]+'</div></div>';
  });
  html+='</div><h2>电影大片</h2><div style="text-align:center;">';
  data.cctv6Movies.forEach(function(item){
    if(!item.newToday){
      var lines=item.info.split('\n');
      html+='<div class="movie"><div class="poster"><div class="poster-text">'+item.name+'</div></div><div class="info"><span class="channel">'+item.channel+'</span><br>'+lines[0]+'<br>'+lines[1]+'</div></div>';
    }
  });
  html+='</div><h2>ITV限免影视</h2><div style="text-align:center;">';
  data.itvMovies.forEach(function(item){
    var lines=item.info.split('\n');
    html+='<div class="movie"><div class="poster"><div class="poster-text">'+item.name+'</div></div><div class="info"><span class="channel">'+item.channel+'</span><br>'+lines[0]+'<br>'+lines[1]+'</div></div>';
  });
  html+='</div><h2>电视剧</h2><div style="text-align:center;">';
  data.dramas.forEach(function(item){
    var lines=item.info.split('\n');
    var tag=item.newToday?'<div class="new-tag">今日新增</div>':'';
    html+='<div class="movie"><div class="poster"><div class="poster-text">'+item.name+'</div></div>'+tag+'<div class="info"><span class="channel">'+item.channel+'</span><br>'+lines[0].replace('豆瓣','口碑')+'<br>'+lines[1]+'</div></div>';
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}).catch(e=>{document.getElementById('content').innerHTML='加载失败：'+e;});
</script>
</body>
</html>
