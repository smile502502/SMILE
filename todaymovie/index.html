      padding:10px 14px;
      font-size:14px;line-height:1.6;

    /* 内容 */

    .section-title{font-size:16px;font-weight:700;margin-bottom:10px;}

    /* 双列网格 */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

    .card{
      background:#fff;border-radius:12px;padding:10px 10px 8px;

      display:flex;flex-direction:column;
      min-width:0;
    }
    .card-new{border:2px solid var(--red);}

    /* 片名行：固定高度，片名 flex 省略，徽章靠右 */
    .card-head{
      display:flex;align-items:center;gap:6px;
      height:26px;min-height:26px;margin-bottom:6px;
    }
    .card-name{
      font-size:15px;font-weight:600;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      flex:1;min-width:0;
    }
    .badge-new{
      background:var(--red);color:#fff;font-size:10px;font-weight:700;
      border-radius:8px;padding:2px 6px;white-space:nowrap;flex-shrink:0;
    }

    /* 海报：外层容器固定 2:3 比例。
       用 padding-top:150% 经典方案（相对宽度计算高度），兼容所有浏览器，
       避免 iOS15 以下 Safari 不支持 aspect-ratio 导致容器高度为 0、图片不显示 */
    .poster-wrap{
      position:relative;width:100%;
      padding-top:150%;
      border-radius:8px;overflow:hidden;background:#F0F0F0;
      margin-bottom:6px;
    }
    .poster-wrap img{
      position:absolute;top:0;left:0;width:100%;height:100%;
      object-fit:cover;
    }

    /* 频道行：独立固定高度，保证左右两列对齐 */
    .card-channel{
      font-size:12px;color:#B71C1C;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      height:18px;line-height:18px;margin-bottom:2px;
    }
    .card-body{font-size:12px;line-height:1.5;color:#333;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .card-hint{margin-top:6px;font-size:11px;color:var(--muted);text-align:right;}

    /* 页脚 */
    .footer{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      background:var(--bg);

        html += sectionHTML('🎬 电影大片（' + (data.cctv6Movies ? data.cctv6Movies.length : 0) + '部）', data.cctv6Movies, false);
        html += sectionHTML('📺 电信ITV限免（' + (data.itvMovies ? data.itvMovies.length : 0) + '部）', data.itvMovies, false);
        html += sectionHTML('🌟 高分剧集（' + (data.dramas ? data.dramas.length : 0) + '部）', data.dramas, false);
        wrap.innerHTML = html || '<div class="empty">暂无数据</div>';
        winEl.textContent = fmtWindow(data.window);
        verEl.textContent = '清泉看大片 v1.0';
        updateStaleUI(data.version);
      }

      // ---- 数据加载 ----
      function applyData(data) {
        render(data);
        cacheSave(data);
      }

      function fetchLatest(manual) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', DATA_URL, true);
        xhr.timeout = 10000;
        xhr.onload = function () {
          busy = false; refreshBtn.classList.remove('disabled');
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.version) {
                applyData(data);
                if (manual) flash('已更新：数据版本 ' + data.version);
                return;
              }
            } catch (e) {}
          }
          if (manual) flash('数据格式异常');
        };
        xhr.onerror = function () {
          busy = false; refreshBtn.classList.remove('disabled');
          if (manual) flash('网络异常，请稍后再试');
        };
        xhr.ontimeout = function () {
          busy = false; refreshBtn.classList.remove('disabled');
          if (manual) flash('网络超时，请稍后再试');
        };
        xhr.send();
      }

      function flash(msg) {
        winEl.textContent = msg;
        setTimeout(function () {
          var d = cacheLoad();
          if (d) winEl.textContent = fmtWindow(d.window);
        }, 2500);
      }

      function refresh() {
        if (busy) return;
        // 北京时间 0:00-9:59 禁止刷新
        if (bjHour() < 10) {
          flash('数据更新中，请十点后刷新');
          return;
        }
        busy = true; refreshBtn.classList.add('disabled');
        render(cacheLoad() || BUILTIN); // 先秒开
        fetchLatest(true);              // 异步拉最新，成功自动重渲染
      }

      // 启动流程
      function init() {
        var cached = cacheLoad();
        if (cached) {
          render(cached);
          if (!isFresh(cached.version) && bjHour() >= 10) fetchLatest(false);
        } else {
          render(BUILTIN);
          if (bjHour() >= 10) fetchLatest(false);
        }
      }

      // ---- 朗读（speechSynthesis）----
      // ---- 朗读文本预处理 ----
      // 中文数字转换（年份/奖项 2025→二零二五、2015→二零一五，逐位读法）
      function numToChinese(n) {
        var digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
        var s = String(n);
        if (s.length === 4) {
          // 年份类 4 位数字按逐位读法：2025 → 二零二五
          return digits[parseInt(s[0], 10)] + digits[parseInt(s[1], 10)] +
                 digits[parseInt(s[2], 10)] + digits[parseInt(s[3], 10)];
        }
        return digits[parseInt(s, 10)];
      }

      function preprocessForTTS(text) {
        if (!text) return '';
        var s = text;
        // CCTV-6 → CCTV六（连字符数字会被读"负"）；CCTV6/CCTV7/CCTV8/CCTV11/CCTV12 → 中文数字
        s = s.replace(/CCTV-6/g, 'CCTV六').replace(/CCTV-8/g, 'CCTV八').replace(/CCTV-11/g, 'CCTV十一')
             .replace(/CCTV6/g, 'CCTV六').replace(/CCTV7/g, 'CCTV七').replace(/CCTV8/g, 'CCTV八')
             .replace(/CCTV11/g, 'CCTV十一').replace(/CCTV12/g, 'CCTV十二');
        // 完整日期 2025-10-04 → 2025年10月4日（去月日补零）
        s = s.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, function (m, y, mo, d) {
          return y + '年' + parseInt(mo, 10) + '月' + parseInt(d, 10) + '日';
        });
        // 斜线日期 9/15 → 9月15日（去补零，避免被读成分数）
        s = s.replace(/(\d{1,2})\/(\d{1,2})/g, function (m, mo, d) {
          return parseInt(mo, 10) + '月' + parseInt(d, 10) + '日';
        });
        // 时间 09:49 → 9点49分（去补零，避免"零九"）；分钟1-2位兼容（防旧数据"5:2"）
        s = s.replace(/(\d{1,2}):(\d{1,2})/g, function (m, h, mi) {
          return parseInt(h, 10) + '点' + parseInt(mi, 10) + '分';
        });
        // 平台名斜线 → 顿号
        s = s.replace(/\//g, '、');
        // 括号 → 逗号（保留内容）
        s = s.replace(/[（）()]/g, '，');
        // 4位年份/奖项数字（后不跟 年/月/日/点/分 等日期单位）→ 中文数字
        // 注意：不用 lookbehind（旧 iOS Safari<16.4 不支持，会导致整页脚本解析失败）
        s = s.replace(/(\d{4})(?![0-9年日月点分])(?=[^0-9]|$)/g, function (m, n, offset, str) {
          if (offset > 0 && str.charAt(offset - 1) >= '0' && str.charAt(offset - 1) <= '9') return m;
          return numToChinese(n);
        });
        // 单数字后跟量词（部/集/个/次/天/周/场/届/期/种/家/国/班，不含"月"避免破坏日期）→ 中文
        s = s.replace(/(\d)(?=[部集个次天周场届期种家国班])(?![0-9])/g, function (m, n, offset, str) {
          if (offset > 0 && str.charAt(offset - 1) >= '0' && str.charAt(offset - 1) <= '9') return m;
          return numToChinese(n);
        });
        // 清理多余标点
        s = s.replace(/。。/g, '。').replace(/，，/g, '，').replace(/，。/g, '。');
        return s;
      }

      function speakTextOf(name, channel, info) {
        var parts = [];
        if (name) parts.push(name);
        if (channel) parts.push('播出平台，' + channel);
        if (info) parts.push(info.replace(/\n/g, '。'));
        return preprocessForTTS(parts.join('。'));
      }

      var speechSupported = 'speechSynthesis' in window;
      var currentSpeakText = '';

      function speakNow() {
        if (!speechSupported || !currentSpeakText) return;
        try { window.speechSynthesis.cancel(); } catch (e) {}
        var u = new SpeechSynthesisUtterance(currentSpeakText);
        u.lang = 'zh-CN';
        u.rate = 1;
        var voices = window.speechSynthesis.getVoices();
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang && voices[i].lang.indexOf('zh') === 0) { u.voice = voices[i]; break; }
        }
        window.speechSynthesis.speak(u);
      }

      function stopSpeak() {
        if (!speechSupported) return;
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }

      // 详情页
      window.Qingquan = {
        openDetail: function (name, channel, info) {
          var dec = function (s) { try { return decodeURIComponent(s); } catch (e) { return s; } };
          var n = dec(name), c = dec(channel || ''), f = dec(info || '');
          // 返回列表时停止朗读，避免后台继续播
          currentSpeakText = speakTextOf(n, c, f);
          var btns = speechSupported
            ? '<div class="d-btns">' +
              '<button class="d-btn d-btn-speak" onclick="Qingquan.speak()">🔊 朗读</button>' +
              '<button class="d-btn d-btn-stop" onclick="Qingquan.stopSpeak()">⏹ 停止</button>' +
              '</div>'
            : '<div class="d-unsupport">当前浏览器不支持语音朗读</div>';
          wrap.innerHTML =
            '<div class="detail">' +
            '<div class="d-title">' + escapeHtml(n) + '</div>' +
            (c ? '<div class="d-channel">' + escapeHtml(c) + '</div>' : '') +
            '<div class="d-info">' + escapeHtml(f) + '</div>' +
            btns +
            '<a class="back" href="javascript:void(0)" onclick="Qingquan.back()">← 返回列表</a>' +
            '</div>';
          // 进入详情页自动朗读（iOS 需在用户手势内触发；openDetail 本身来自点击，满足手势要求）
          if (speechSupported) {
            speakNow();
          }
        },
        speak: function () { speakNow(); },
        stopSpeak: function () { stopSpeak(); },
        back: function () {
          stopSpeak();  // 返回列表先停朗读
          var cached = cacheLoad();
          render(cached || BUILTIN);
        }
      };

      // 刷新按钮
      refreshBtn.addEventListener('click', refresh);

      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      }

      init();
    })();
  </script>
</body>
